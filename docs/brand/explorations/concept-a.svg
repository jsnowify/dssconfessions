<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Logo Concept A: Vinyl Speech Bubble</title>
  <desc>A neo-brutalist vinyl record shaped as a speech bubble with dashed groove rings, pastel center label, and a warm heart.</desc>

  <!-- Solid Offset Drop Shadow -->
  <path
    d="M 62 16 A 44 44 0 0 1 106 60 A 44 44 0 0 1 62 104 C 55 104 49 101.5 44 98 L 24 112 C 22 113.5 19.5 111.5 20.5 109 C 22 101.5 24.5 94.5 28.5 88 A 44 44 0 0 1 18 60 A 44 44 0 0 1 62 16 Z"
    fill="#1F2A44"
    opacity="0.25"
  />

  <!-- Main Speech-Bubble Vinyl Body -->
  <path
    d="M 60 12 A 44 44 0 0 1 104 56 A 44 44 0 0 1 60 100 C 53 100 47 97.5 42 94 L 22 108 C 20 109.5 17.5 107.5 18.5 105 C 20 97.5 22.5 90.5 26.5 84 A 44 44 0 0 1 16 56 A 44 44 0 0 1 60 12 Z"
    fill="#1F2A44"
    stroke="#1F2A44"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Outer Sound Grooves (Dashed for visible spin micro-interaction) -->
  <g class="grooves" style="transform-origin: 60px 56px;">
    <circle
      cx="60"
      cy="56"
      r="36"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity="0.32"
      stroke-width="1.75"
      stroke-dasharray="6 4.5"
      stroke-linecap="round"
    />
    <circle
      cx="60"
      cy="56"
      r="27"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity="0.22"
      stroke-width="1.25"
      stroke-dasharray="4 4"
      stroke-linecap="round"
    />
  </g>

  <!-- Subtle Vinyl Sheen Arc -->
  <path
    d="M 34 32 A 40 40 0 0 1 88 32"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.18"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Center Record Label (Pastel Pink) -->
  <circle
    cx="60"
    cy="56"
    r="18"
    fill="#FFD9E8"
    stroke="#1F2A44"
    stroke-width="2"
  />

  <!-- Center Heart (Warm Coral) -->
  <path
    d="M 60 64.5 L 54.8 59.8 C 50.8 56.1 48 53.5 48 50.2 C 48 47.4 50.1 45.2 52.8 45.2 C 54.4 45.2 56 46 57 47.2 L 60 50.4 L 63 47.2 C 64 46 65.6 45.2 67.2 45.2 C 69.9 45.2 72 47.4 72 50.2 C 72 53.5 69.2 56.1 65.2 59.8 L 60 64.5 Z"
    fill="#FF6B6B"
  />

  <!-- Tiny White Specular Dot on Heart -->
  <circle cx="53" cy="48" r="1.25" fill="#FFFFFF" />

  <!-- Center Spindle Hole -->
  <circle cx="60" cy="56" r="2" fill="#1F2A44" />
</svg>
