<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Logo Concept B: Envelope and Peeking Vinyl</title>
  <desc>A postal love-letter envelope with an emerging vinyl record and heart wax seal.</desc>

  <!-- Offset Shadow -->
  <rect x="24" y="44" width="84" height="64" rx="10" fill="#1F2A44" opacity="0.25" />

  <!-- Peeking Vinyl Record -->
  <g transform="translate(64, 46)">
    <circle cx="0" cy="0" r="32" fill="#1F2A44" stroke="#1F2A44" stroke-width="2" />
    <circle cx="0" cy="0" r="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="5 3" />
    <circle cx="0" cy="0" r="14" fill="#FFE1D3" stroke="#1F2A44" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3" fill="#1F2A44" />
  </g>

  <!-- Envelope Back and Pocket -->
  <rect x="20" y="40" width="84" height="64" rx="10" fill="#CFE3FF" stroke="#1F2A44" stroke-width="2.5" />

  <!-- Envelope Fold Lines -->
  <path d="M 22 42 L 64 74 L 102 42" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linejoin="round" />
  <path d="M 22 102 L 52 70" fill="none" stroke="#1F2A44" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 102 102 L 74 70" fill="none" stroke="#1F2A44" stroke-width="1.5" stroke-linecap="round" />

  <!-- Heart Wax Seal -->
  <circle cx="64" cy="74" r="11" fill="#FF6B6B" stroke="#1F2A44" stroke-width="2" />
  <path
    d="M 64 78 L 60.5 74.8 C 57.5 72.2 55.5 70.4 55.5 68.2 C 55.5 66.4 57 65 58.8 65 C 59.9 65 61 65.6 61.7 66.4 L 64 68.6 L 66.3 66.4 C 67 65.6 68.1 65 69.2 65 C 71 65 72.5 66.4 72.5 68.2 C 72.5 70.4 70.5 72.2 67.5 74.8 L 64 78 Z"
    fill="#FFFFFF"
  />
</svg>
