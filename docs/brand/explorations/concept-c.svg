<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Logo Concept C: Handwriting Monogram d</title>
  <desc>A geometric letter d formed by a spinning vinyl disc bowl and musical note ascender.</desc>

  <!-- Offset Shadow -->
  <g transform="translate(4, 4)" opacity="0.25">
    <circle cx="54" cy="72" r="38" fill="#1F2A44" />
    <rect x="80" y="16" width="16" height="74" rx="8" fill="#1F2A44" />
    <circle cx="98" cy="18" r="8" fill="#1F2A44" />
  </g>

  <!-- Musical Note Ascender (Stem) -->
  <rect x="76" y="12" width="16" height="74" rx="8" fill="#3F6AE8" stroke="#1F2A44" stroke-width="2.5" />
  <circle cx="94" cy="14" r="7" fill="#FF6B6B" stroke="#1F2A44" stroke-width="2" />

  <!-- Disc Bowl of the d -->
  <circle cx="50" cy="68" r="38" fill="#1F2A44" stroke="#1F2A44" stroke-width="2.5" />
  <circle cx="50" cy="68" r="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="5 3.5" />

  <!-- Center Label & Heart -->
  <circle cx="50" cy="68" r="16" fill="#FFF2B8" stroke="#1F2A44" stroke-width="2" />
  <path
    d="M 50 74 L 46 70.2 C 43 67.3 41 65.2 41 62.7 C 41 60.6 42.6 59 44.7 59 C 45.9 59 47.1 59.6 47.9 60.5 L 50 62.8 L 52.1 60.5 C 52.9 59.6 54.1 59 55.3 59 C 57.4 59 59 60.6 59 62.7 C 59 65.2 57 67.3 54 70.2 L 50 74 Z"
    fill="#FF6B6B"
  />
  <circle cx="50" cy="68" r="2" fill="#1F2A44" />
</svg>
